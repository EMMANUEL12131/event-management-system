<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Event Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Create an Account</h1>
  </header>

  <main>
    <!-- A form with an id so our JavaScript can find and control it -->
    <form id="registerForm">
      <!-- Each input has a "name" attribute matching what our backend expects -->
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="email" id="email" placeholder="Email Address" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Register</button>
    </form>

    <!-- An empty paragraph we'll use to show success or error messages -->
    <p id="message"></p>
  </main>

  <!-- Link to our JavaScript file, placed at the end so the HTML loads first -->
  <script src="register.js"></script>
</body>
</html>
